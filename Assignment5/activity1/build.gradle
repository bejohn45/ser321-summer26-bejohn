plugins {
    id 'java'
    id 'application'
}

group = 'taskone'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Support Java 18-22
sourceCompatibility = '18'
targetCompatibility = '18'


task runLeader(type: JavaExec) {
    group = 'application'
    description = 'Run the Leader program'
    mainClass = 'Leader'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in

    // Allow passing port as argument
    if (project.hasProperty('port')) {
        args project.property('port')
    }
}


task runWorker(type: JavaExec) {
    group = 'application'
    description = 'Run the Worker program'
    mainClass = 'Worker'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in

    // Allow passing host and port as arguments
    if ((project.hasProperty('host')) && (project.hasProperty('port'))) 
    {
        args project.property('host'), project.property('port')
    }
}


// Default application main class
application {
    mainClass = 'Leader'
}

test {
    useJUnitPlatform()
}
